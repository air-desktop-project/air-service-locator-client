[package]
name = "asl-adresses"
description = "Les adresses IPv6 de cette machine et leurs drapeaux — temporaire, dépréciée, stable —, pour qu'`asl echo` se lie à celle qui ne tourne pas (décision 108)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# **LA SEULE DÉPENDANCE EST `libc`, ET SEULEMENT POUR DÉCLARER** (C4) :
# `getifaddrs`, `freeifaddrs`, `socket`, `ioctl`, `close` — des fonctions de la
# libc du système, que tout programme Rust emploie déjà par sa bibliothèque
# standard. Rien n'est COMPILÉ : ni `*-sys`, ni `cc`, ni `bindgen`, ni
# `pkg-config`, aucun script de construction. `check-sans-c.sh` l'admet
# nommément, et pour cette raison.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

