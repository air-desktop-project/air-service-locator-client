[package]
name = "asl-cli"
description = "L'utilitaire `asl` — annoncer, résoudre et diagnostiquer à la main."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# **LE BINAIRE S'APPELLE `asl`.** Ce que l'on tape n'a pas à porter le suffixe
# qui rend le nom de la crate unique dans un registre.
[[bin]]
name = "asl"
path = "src/main.rs"

[dependencies]
asl-client.workspace = true
asl-client-tokio.workspace = true
asl-cle.workspace = true
asl-id.workspace = true
asl-proto.workspace = true
asl-echo.workspace = true
# Le codec UPnP de la passerelle de l'écho : **ici, et jamais dans
# `asl-client`** (§3 quater) — la bibliothèque que chargent les daemons des
# autres n'ouvre rien sur la box.
asl-upnp.workspace = true

# `signal` EN PLUS, ET SEULEMENT ICI. `asl announce` tient l'annonce au premier
# plan, et Ctrl-C doit la retirer PROPREMENT — sinon l'annuaire donne une adresse
# morte pendant une minute. La bibliothèque, elle, ne demande pas cette feature :
# un daemon a déjà son propre traitement des signaux, et lui en imposer un serait
# décider à sa place.
tokio = { workspace = true, features = ["signal", "sync", "io-util"] }

# **AUCUN ANALYSEUR D'ARGUMENTS TIERS.** La grammaire tient en deux cents lignes
# et n'a ni sous-commandes imbriquées ni complétion ; en tirer une centaine de
# crates dans le verrou d'un dépôt dont `check-sans-c.sh` inspecte le graphe
# construit à chaque passage ne se paierait pas. Voir `src/arguments.rs`.

[dev-dependencies]
# **LE BANC D'`asl-client-tokio`, PARTAGÉ ET NON RECOPIÉ**, pour `tests/echo.rs` :
# `asl echo` et `asl ping` de bout en bout, deux processus contre un annuaire
# de banc qui tient leurs deux connexions et signe un vrai jeton. Ce sont les
# dépendances du banc, rien de plus — et aucune n'entre dans le binaire.
ams-h3.workspace = true
ams-proto-http.workspace = true
ams-proto-quic.workspace = true
ams-quic.workspace = true
ams-quic-tls.workspace = true
ams-tls.workspace = true
asl-api.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[lints]
workspace = true
