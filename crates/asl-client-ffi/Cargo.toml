[package]
name = "asl-client-ffi"
description = "L'ABI C d'asl-client — le passage par lequel entrent les liaisons Python, Ruby, C++, Kotlin et Swift."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# `cdylib` pour ce qui se charge à l'exécution — Python, Ruby, la JVM.
# `staticlib` pour ce qui se lie à la construction — C++, et Swift quand on ne
# veut pas d'objet partagé à installer.
#
# LES DEUX, ET NON L'UN OU L'AUTRE : cinq écosystèmes n'ont pas la même façon de
# charger du code natif, et n'en imposer qu'une reviendrait à choisir lesquels
# sont bienvenus.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
asl-client.workspace = true
asl-client-tokio.workspace = true
asl-id.workspace = true
asl-proto.workspace = true
asl-cle.workspace = true
asl-api.workspace = true

# `rt-multi-thread` EN PLUS, ET SEULEMENT ICI. L'annonce est tenue par une
# connexion : elle doit progresser pendant que l'hôte fait autre chose. Un
# ordonnanceur à un seul fil ne progresse que lorsque quelqu'un l'attend — ce
# dont l'utilitaire `asl` peut se contenter, mais pas une bibliothèque chargée
# dans le processus d'un tiers. Un seul fil de travail : ce client ne tient
# qu'une connexion.
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
# Pour l'exemple `appareil` seulement : une clé P-256 logicielle qui joue le
# rôle du matériel d'un téléphone. Elle est déjà dans le graphe par `asl-cle`.
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }

[lints]
workspace = true
