# Manifeste du workspace air-service-locator-client.
#
# CE QUE DES TIERS INSTALLENT. Trois choses, un seul dépôt :
#
#   `asl-client`      La bibliothèque Rust. Ce qu'un daemon lie pour s'annoncer,
#                     et ce qu'un de ses clients lie pour retrouver un port.
#   `asl-client-ffi`  La même, derrière une ABI C. C'est par là que passent les
#                     liaisons Python, Ruby, C++, Kotlin et Swift (`liaisons/`).
#   `asl-cli`         L'utilitaire `asl`, pour faire à la main ce que la
#                     bibliothèque fait dans un programme.
#
# POURQUOI CE DÉPÔT EST SÉPARÉ DU SERVEUR
#
# Pas pour ranger. Ceci est un PRODUIT à part : son public n'est pas nous, son
# rythme de publication n'est pas celui d'un serveur qu'on déploie sur ses
# propres machines, et sa surface est un engagement envers cinq écosystèmes qui
# ne se mettent pas à jour au même rythme (contrainte C12 du dépôt serveur).
#
# **Et la frontière rend LITTÉRALE une règle qui n'était qu'un conseil.** Dans le
# dépôt serveur, « le client ne doit pas dépendre de l'étage 2 ou 3 » se
# respectait par discipline. Ici, ces crates ne sont pas atteignables : un daemon
# qui s'annonce ne peut PAS embarquer la base de données de l'annuaire, même par
# accident.
#
# ── LA DÉPENDANCE VERS LE DÉPÔT SERVEUR, ET CE QU'ELLE COÛTE ────────────────
#
# `asl-id` et `asl-proto` vivent dans `air-service-locator-server`, qui porte
# les spécifications : le dépôt qui décrit la grammaire porte la grammaire.
#
# Elles sont tirées par une dépendance `git` ÉPINGLÉE SUR UN SHA. C'est ce qui
# préserve la reproductibilité — mais **une dépendance `git` échappe à
# `cargo audit`**, et le SHA doit être revu à chaque changement de protocole
# plutôt que suivi aveuglément.
#
# **C'EST UNE SOLUTION D'ATTENTE, ET ELLE EST DATÉE.** Ce qui la remplacera :
# publier `asl-id` et `asl-proto` sur crates.io le jour où le protocole se
# stabilise. Un tiers qui embarque cette bibliothèque doit pouvoir la tirer d'un
# registre, pas d'un dépôt git dont il ne sait rien.

[workspace]
resolver = "3"
members = [
    "crates/asl-client",
    "crates/asl-client-tokio",
    "crates/asl-client-ffi",
    "crates/asl-cli",
]

# `fuzz/` est une crate cargo-fuzz HORS de ce workspace : `libfuzzer-sys` et
# `arbitrary` n'ont rien à faire dans le lock de ce qu'un tiers embarque, et les
# drapeaux du sanitizer n'ont rien à faire dans la vérification ordinaire. Les
# raisons complètes sont en tête de `fuzz/Cargo.toml`.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# PAS DE `rust-version`, ET C'EST DÉLIBÉRÉ.
#
# Ce champ déclare une version MINIMALE, ce qui n'a de sens que si l'on accepte
# d'être compilé par plusieurs toolchains. Ici `rust-toolchain.toml` en épingle
# UNE, datée, celle d'Air : il n'y a pas d'intervalle à déclarer, et un
# `rust-version` en inventerait un que personne ne vérifie.
#
# Il redeviendra utile le jour où ces crates seront publiées sur crates.io — un
# consommateur, lui, a bien une toolchain à lui.
license = "MPL-2.0"
authors = ["air-service-locator contributors"]
repository = "https://github.com/air-desktop-project/air-service-locator-client"

[workspace.dependencies]
asl-client = { path = "crates/asl-client", version = "0.1.0" }
asl-client-tokio = { path = "crates/asl-client-tokio", version = "0.1.0" }

# La grammaire, tirée du dépôt qui porte les spécifications.
asl-id = { git = "https://github.com/air-desktop-project/air-service-locator-server", rev = "e4255cfa91b35f33e6dbee9935e85ddf8323fb33" }
asl-proto = { git = "https://github.com/air-desktop-project/air-service-locator-server", rev = "e4255cfa91b35f33e6dbee9935e85ddf8323fb33" }
asl-cle = { git = "https://github.com/air-desktop-project/air-service-locator-server", rev = "e4255cfa91b35f33e6dbee9935e85ddf8323fb33" }

# ── LA PILE QUIC ET HTTP/3, EMPRUNTÉE À `air-mail-server` (C15) ─────────────
#
# **Elle n'est réécrite ni ici ni ailleurs, et aucune pile tierce n'entre** :
# `scripts/check-pile.sh` le vérifie sur le graphe RÉSOLU, donc y compris sur ce
# que personne n'a déclaré.
#
# Elle est en Rust pur, et c'est la condition qui l'a fait retenir : cette
# bibliothèque est chargée dans des interpréteurs Python et Ruby, où une pile
# qui lierait sa propre libcrypto entrerait en conflit avec celle du processus
# hôte. `scripts/check-sans-c.sh` le vérifie.
#
# **La moitié CLIENTE de cette pile a été écrite pour ce dépôt-ci** — une
# connexion QUIC qui se connecte, un conducteur HTTP/3 qui émet des requêtes —
# et elle vit là-bas, à côté de la moitié serveur. Deux moitiés séparées
# finiraient par ne plus se parler.
#
# Épinglées sur un COMMIT, jamais sur une branche : une branche qui avance
# changerait le code compilé ici sans qu'une ligne de ce dépôt ait bougé.
ams-h3 = { git = "https://github.com/air-desktop-project/air-mail-server.git", rev = "88b36a22cbea7a1ca342fb6ea07fbbf0e76e4abe" }
ams-proto-http = { git = "https://github.com/air-desktop-project/air-mail-server.git", rev = "88b36a22cbea7a1ca342fb6ea07fbbf0e76e4abe" }
ams-quic-client = { git = "https://github.com/air-desktop-project/air-mail-server.git", rev = "88b36a22cbea7a1ca342fb6ea07fbbf0e76e4abe" }
ams-proto-h3 = { git = "https://github.com/air-desktop-project/air-mail-server.git", rev = "88b36a22cbea7a1ca342fb6ea07fbbf0e76e4abe" }
ams-proto-quic = { git = "https://github.com/air-desktop-project/air-mail-server.git", rev = "88b36a22cbea7a1ca342fb6ea07fbbf0e76e4abe" }
ams-quic = { git = "https://github.com/air-desktop-project/air-mail-server.git", rev = "88b36a22cbea7a1ca342fb6ea07fbbf0e76e4abe" }
ams-quic-tls = { git = "https://github.com/air-desktop-project/air-mail-server.git", rev = "88b36a22cbea7a1ca342fb6ea07fbbf0e76e4abe" }
ams-tls = { git = "https://github.com/air-desktop-project/air-mail-server.git", rev = "88b36a22cbea7a1ca342fb6ea07fbbf0e76e4abe" }

# `rustls` POUR LA CONFIGURATION CLIENTE, et rien d'autre : les racines à qui
# l'on fait confiance, et le nom qu'on exige du certificat. Le chiffrement, lui,
# vient du fournisseur d'`ams-tls`, en Rust pur.
rustls = { version = "0.23", default-features = false, features = ["std"] }

# `tokio` POUR UNE SOCKET ET UN DÉLAI. Rien de plus : pas de `net` complet, pas
# de système de fichiers. Un daemon tiers qui embarque cette bibliothèque hérite
# de ce qu'elle tire, et chaque feature de plus est une décision qu'on prend à
# sa place.
tokio = { version = "1", default-features = false, features = ["net", "time", "rt"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
arithmetic_side_effects = "deny"

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1
