# CI d'air-service-locator-client.
#
# Le gate DCO et la vérification du code, comme dans le dépôt serveur — mêmes
# scripts, même ordre, mêmes raisons. Le formatage est EN DERNIER : une faute de
# forme ne doit pas cacher une faute de fond.
#
# ── CE DÉPÔT A UNE FRAGILITÉ QUE LE SERVEUR N'A PAS ─────────────────────────
#
# Il tire `asl-id` et `asl-proto` par une dépendance `git` épinglée sur un SHA du
# dépôt serveur. La construction dépend donc de la disponibilité de GitHub et de
# l'existence de ce SHA — une réécriture d'historique là-bas casserait ici, sans
# que rien ne l'annonce.
#
# C'est une raison de plus de publier ces deux crates sur crates.io quand le
# protocole se stabilisera, et non seulement une commodité pour les tiers.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'partage' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  dco:
    name: DCO et paternité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Déterminer la base de comparaison
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            case "$base" in
              0000000000000000000000000000000000000000) base="" ;;
            esac
            if [ -n "$base" ] && ! git rev-parse --verify --quiet "$base" >/dev/null; then
              base=""
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: check-dco
        run: ./scripts/check-dco.sh "${{ steps.base.outputs.base }}"

  verification:
    name: compile, clippy, tests, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain épinglée
        run: |
          rustup show active-toolchain
          cargo --version
          rustc --version

      # ── EN PREMIER, ET INSTANTANÉ ────────────────────────────────────────
      #
      # Un verdict rendu par la mauvaise toolchain ne vaut rien. Ici `air`
      # n'existe pas : le contrôle ne compare qu'à la valeur écrite dans le
      # script, et il le DIT.
      - name: check-toolchain
        run: ./scripts/check-toolchain.sh

      - name: check-compile
        run: ./scripts/check-compile.sh

      # ── LA PILE (C15) ────────────────────────────────────────────────────
      #
      # Elle compte DAVANTAGE ici que dans le dépôt serveur : cette bibliothèque
      # est chargée dans des processus qui ne sont pas les nôtres, et une pile
      # tierce y ferait entrer des dépendances C dans l'interpréteur de
      # quelqu'un d'autre.
      - name: check-pile
        run: ./scripts/check-pile.sh

      - name: check-clippy
        run: ./scripts/check-clippy.sh

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

      # ── LES DEUX SORTIES NATIVES CONSTRUISENT-ELLES ? ───────────────────
      #
      # `cargo build --workspace` construit `asl-client-ffi`, mais rien ne dit
      # ici que les artefacts que les liaisons chargent existent RÉELLEMENT. Un
      # `crate-type` mal formé se découvrirait chez le premier utilisateur
      # Python.
      - name: L'objet partagé et la bibliothèque statique existent
        run: |
          test -f target/debug/libasl_client_ffi.so
          test -f target/debug/libasl_client_ffi.a
          echo "cdylib et staticlib : présents"

      # ── L'ABI (C12) ──────────────────────────────────────────────────────
      #
      # APRÈS l'étape ci-dessus, et ce n'est pas un hasard : `check-abi` lit les
      # symboles DANS le `.so`. Si celui-ci n'existe pas, l'échec doit dire
      # « crate-type » et non « ABI » — deux causes très différentes, et c'est
      # l'ordre qui les distingue.
      - name: check-abi
        run: ./scripts/check-abi.sh

      - name: check-format
        run: ./scripts/check-format.sh
