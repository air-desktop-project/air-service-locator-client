# Toolchain Rust d'air-service-locator-server — UNE SEULE VERSION, PARTOUT.
#
# Le pin est DATÉ par sa version exacte, pas par un canal roulant : c'est ce qui
# rend une vérification rejouable. Un `channel = "stable"` désigne une version
# différente toutes les six semaines ; deux mesures prises à deux mois d'écart ne
# sont alors plus comparables, et un échec de CI ne dit plus si c'est le code ou
# l'amont qui a bougé.
#
# La version est celle d'`air-service-locator-client`, et ce n'est pas une coïncidence : les
# deux dépôts visent le même portage ultérieur vers le stack Air, et deux pins
# différents feraient deux vérités sur ce que le code compile.

[toolchain]
channel = "1.98.0"
# `llvm-tools-preview` : exigé par `cargo llvm-cov`, qui outillera la mesure de
# couverture des étages 1 et 2 quand il y aura du code à mesurer.
components = ["rustfmt", "clippy", "llvm-tools-preview"]
profile = "minimal"
