# Toolchain Rust — **CELLE D'AIR, ET RIEN D'AUTRE**.
#
# # Pourquoi celle-là, et pourquoi pas « la plus faible qui suffit »
#
# Ce dépôt n'a besoin de rien de ce que nightly apporte. Il pourrait tourner sur
# stable, et c'est ce qu'il faisait — `1.98.0`, avec en commentaire l'argument
# « la contrainte la plus faible qui suffit ».
#
# **CET ARGUMENT ÉTAIT LE BON POUR UN DÉPÔT ISOLÉ, ET LE MAUVAIS POUR CELUI-CI.**
#
# Deux raisons le renversent :
#
#   1. **Nous tirons du code d'`air-mail-server`** — la pile QUIC et HTTP/3 — et
#      ce code a vocation à MIGRER DANS `air`. Le jour où il y sera, il sera
#      compilé par la toolchain d'Air. Deux pins différents, ce sont deux LLVM,
#      et les profils de couverture que l'un écrit, l'autre ne sait pas les
#      relire — la panne exacte qu'Air a payée le 2026-08-15 avec ses trois
#      toolchains.
#
#   2. **Il y aura une version `linux-air` de tous ces composants.** Elle
#      reposera sur la bibliothèque standard de `linux-air`, une cible JSON
#      custom et `-Z build-std` : cela ne compile QUE sur nightly. Découvrir ce
#      jour-là que le code ne passe pas la toolchain d'Air serait le découvrir
#      trop tard.
#
# **Le pin est DATÉ**, jamais un canal roulant : c'est ce qui rend une
# vérification rejouable. `nightly` tout court désigne une version différente
# chaque jour, et un échec de CI ne dirait plus si c'est le code ou l'amont qui a
# bougé.
#
# # Ce fichier ne se modifie pas seul
#
# Il doit rester ÉGAL à `~/Code/air/rust-toolchain.toml`. Un écart entre les deux
# est une régression, pas une variante — et il faut le corriger ici, en
# s'alignant sur Air, jamais l'inverse.

[toolchain]
channel = "nightly-2026-07-11"
# `rust-src` : exigé par `-Z build-std`, donc par la future cible `linux-air`.
# Il ne sert à rien aujourd'hui, et il est là pour que la toolchain soit LA MÊME
# que celle d'Air — un composant en moins ferait un pin qui n'en est plus un.
components = ["rustfmt", "clippy", "rust-src", "llvm-tools-preview"]
profile = "minimal"
